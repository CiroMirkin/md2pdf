<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-labelledby="contexto-title contexto-desc" font-family="Geist, 'Helvetica Neue', Arial, sans-serif">
  <title id="contexto-title">Contexto de md2pdf</title>
  <desc id="contexto-desc">El usuario lanza md2pdf desde Nemo, que lee el archivo markdown, escribe el PDF, instala librerías con uv y avisa por notificación de escritorio.</desc>
  <defs>
    <marker id="contexto-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#6b7080"/></marker>
    <marker id="contexto-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="#bf4520"/></marker>
  </defs>
  <rect width="1000" height="340" fill="#f5f5f5"/>
  <g fill="none" stroke="#6b7080" stroke-width="1.5" marker-end="url(#contexto-arrow)">
    <path d="M130 180 H230"/>
    <path d="M340 180 H440" stroke="#bf4520" marker-end="url(#contexto-arrow-accent)"/>
    <path d="M620 130 H692 a8 8 0 0 0 8 -8 V78 a8 8 0 0 1 8 -8 H840"/>
    <path d="M620 180 H840"/>
    <path d="M620 230 H692 a8 8 0 0 1 8 8 V282 a8 8 0 0 0 8 8 H840"/>
  </g>
  <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b7080" text-anchor="middle">
    <text x="180" y="172">clic derecho</text>
    <text x="390" y="172">ejecuta</text>
    <text x="770" y="62">lee y escribe</text>
    <text x="730" y="172">instala librerías</text>
    <text x="770" y="282">avisa</text>
  </g>
  <g stroke-width="1.5" font-size="14" font-weight="600" fill="#2d3142" text-anchor="middle">
    <rect x="20" y="150" width="110" height="60" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="75" y="185">Usuario</text>
    <rect x="230" y="150" width="110" height="60" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="285" y="185">Nemo</text>
    <rect x="440" y="100" width="180" height="160" rx="6" fill="#fbeee9" stroke="#bf4520" stroke-width="2"/>
    <text x="530" y="172" font-size="18">md2pdf</text>
    <text x="530" y="194" font-size="11" font-weight="400" fill="#6b7080" font-family="'Geist Mono', ui-monospace, monospace">simple, doble, paginado</text>
    <rect x="840" y="40" width="140" height="60" rx="6" fill="#fff" stroke="#2d3142"/>
    <text x="910" y="66">Archivos</text>
    <text x="910" y="86" font-size="11" font-weight="400" fill="#6b7080" font-family="'Geist Mono', ui-monospace, monospace">.md y .pdf</text>
    <rect x="840" y="150" width="140" height="60" rx="6" fill="#fff" stroke="#2d3142" stroke-dasharray="5 4"/>
    <text x="910" y="176">uv y PyPI</text>
    <text x="910" y="196" font-size="11" font-weight="400" fill="#6b7080" font-family="'Geist Mono', ui-monospace, monospace">solo la 1ª vez</text>
    <rect x="840" y="260" width="140" height="60" rx="6" fill="#fff" stroke="#2d3142" stroke-dasharray="5 4"/>
    <text x="910" y="286">Escritorio</text>
    <text x="910" y="306" font-size="11" font-weight="400" fill="#6b7080" font-family="'Geist Mono', ui-monospace, monospace">notify-send</text>
  </g>
</svg>
